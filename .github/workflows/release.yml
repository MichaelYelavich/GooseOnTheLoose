name: Publish beta
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested version tag, such as v0.4.0-beta.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidates
          path: candidate
      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          . ./tools/common.ps1
          if ($env:RELEASE_TAG -ne ('v'+$ReleaseVersion)) { throw 'Tag must match Version.props.' }
          $files=@(Get-ChildItem candidate -Recurse -File | Where-Object Name -Match '(Setup.exe|windows.zip|source.zip)$')
          if ($files.Count -ne 3) { throw 'Exactly three release packages are required.' }
          $checksums=Get-ChildItem candidate -Recurse -Filter checksums.txt
          if (@($checksums).Count -ne 1) { throw 'Missing build checksums.' }
          $body=(Get-Content -Raw RELEASE_NOTES.md)+"`n## SHA-256`n`n"+(Get-Content -Raw $checksums.FullName)
          $notes=Join-Path $env:RUNNER_TEMP release-notes.md
          [IO.File]::WriteAllText($notes,$body)
          & gh release create $env:RELEASE_TAG @($files.FullName) --verify-tag --prerelease --title 'Beta Release 1' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
